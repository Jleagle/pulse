version: '3.8'

services:
  pulse:
    build: .
    image: pulse:latest
    container_name: pulse-self-hosted
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      # Optional: Pre-configure Google OAuth credentials via environment variables.
      # If omitted, you can configure them interactively directly in Pulse's Web UI (Settings Tab)!
      - CLIENT_ID=${CLIENT_ID:-}
      - CLIENT_SECRET=${CLIENT_SECRET:-}
      - REDIRECT_URL=${REDIRECT_URL:-http://localhost:8080/oauth/callback}
    volumes:
      # Persists config.json when credentials are set via Web UI
      - ./data:/app/data
