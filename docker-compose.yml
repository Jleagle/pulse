services:
  pulse:
    build: .
    image: pulse:latest
    container_name: pulse-self-hosted
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      # Configure Google OAuth credentials via environment variables or .env file
      - CLIENT_ID=${CLIENT_ID:-}
      - CLIENT_SECRET=${CLIENT_SECRET:-}
      - REDIRECT_URL=${REDIRECT_URL:-http://localhost:8080/oauth/callback}
      - PULSE_PASSWORD=${PULSE_PASSWORD:-}
